# 现在只开 HTTP。ICP 备案通过、绑定域名后，再加 HTTPS 配置（并在 .env 里设 COOKIE_SECURE=1）。
# 这个文件在构建前端镜像时打包进去（见 web/Dockerfile），改了要重新构建：sudo sentence-update
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 1m;
    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass         http://api:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # AI 出题可能要一两分钟
    }

    # Vite 构建出来的 JS、CSS 文件名带内容哈希，内容变了文件名就变，可以放心长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 页面本身每次都确认一下有没有更新，这样发布后马上能拿到新的文件名
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.html;
    }
}
