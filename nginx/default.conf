# 网站容器里的 Nginx：静态页面 + 把 /api/ 转给后端。只说 HTTP。
# HTTPS 由服务器上的 Nginx 负责（scripts/enable-https.sh 配置），它把请求转到这里，
# 并用 X-Real-IP、X-Forwarded-Proto 告诉这里真实的访问者 IP 和是不是 HTTPS。
# 这个文件在构建前端镜像时打包进去（见 web/Dockerfile），改了要重新构建：sudo sentence-update

# 请求是从服务器本机的 Nginx 转过来的（Docker 内网地址）时，才相信它给的真实 IP；外网直接访问时不信
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

# 外层 Nginx 说是 HTTPS 就是 HTTPS；没有外层时按这里自己的协议
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 1m;
    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass         http://api:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;   # AI 出题可能要一两分钟
    }

    # Vite 构建出来的 JS、CSS 文件名带内容哈希，内容变了文件名就变，可以放心长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 页面本身每次都确认一下有没有更新，这样发布后马上能拿到新的文件名
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.html;
    }
}
