# 每次推送都检查：代码格式、ESLint、类型检查、后端测试、前端构建，再用 Docker 把整个网站起一遍。
# 服务器上的自动更新（scripts/update.sh）只部署这里全部通过的提交。
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # 明确用 bash：这样会带上 pipefail，管道（| tee）前面的命令出错时这一步也会失败
    shell: bash

env:
  # 仓库里的 .npmrc 用的是腾讯云镜像（给国内服务器用），GitHub 上直接用官方源
  npm_config_registry: https://registry.npmjs.org/

jobs:
  check:
    name: 代码检查、类型检查、测试、构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # 后端测试通过 psql 连这个数据库（见 api/test/helpers.ts）
      TEST_PGHOST: localhost
      TEST_PGPORT: '5432'
      TEST_PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # 每一步的输出另存一份，出错时把最后几十行贴到检查结果里（不用点开日志就能看到原因）
      - name: 安装依赖
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: 代码格式（Prettier）
        run: npm run format:check 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: 代码检查（ESLint）
        run: npm run lint 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: 类型检查（TypeScript）
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: 后端测试
        run: npm test 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: 前端构建
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: 把出错的输出贴到检查结果里
        if: failure()
        run: |
          body=$(grep -v '^\s*$' "$RUNNER_TEMP/step.log" | tail -n 60 | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=出错的输出（最后 60 行）::$body"

  docker:
    name: Docker 镜像构建 + 整站启动
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: 准备 .env
        run: |
          cp .env.example .env
          sed -i "s/^COOKIE_SECRET=.*/COOKIE_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)/" .env
          sed -i 's/^ACCESS_PASSWORD=.*/ACCESS_PASSWORD=ci-password/' .env
          sed -i 's/^WEB_PORT=.*/WEB_PORT=8080/' .env
      - name: 构建并启动
        env:
          NPM_REGISTRY: https://registry.npmjs.org/
        run: docker compose up -d --build 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: 等网站起来
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/health | grep -q '"db":true'; then echo "健康检查通过"; break; fi
            [ "$i" = 40 ] && { echo "::error::网站没有正常启动"; exit 1; }
            sleep 3
          done
      - name: 检查页面和静态文件
        run: |
          html=$(curl -fsS http://127.0.0.1:8080/)
          echo "$html" | grep -q '长难句拆解台'
          # 练习、记录、设置、邀请码管理各有地址，直接打开（刷新）也是这个页面
          for p in /practice /records /settings /settings/invites; do
            curl -fsS "http://127.0.0.1:8080$p" | grep -q '长难句拆解台'
          done
          asset=$(echo "$html" | grep -o '/assets/[^"]*\.js' | head -n 1)
          curl -fsS -o /dev/null "http://127.0.0.1:8080${asset}"
          curl -fsSI "http://127.0.0.1:8080${asset}" | grep -qi 'immutable'
          curl -fsS http://127.0.0.1:8080/api/session | grep -q '"unlocked":false'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"password":"ci-password"}' http://127.0.0.1:8080/api/unlock)
          [ "$code" = 200 ] || { echo "::error::登录失败（$code）"; exit 1; }
      # 在 GitHub 的机器上真的跑一遍 scripts/enable-https.sh：用系统的 Nginx（和服务器一样，80 端口上已经有一个原来的网站），
      # 只把 acme.sh 换成假的——不连 Let's Encrypt，但和它一样从 80 端口取验证文件；证书用自签的
      - name: HTTPS（scripts/enable-https.sh）
        run: |
          exec > >(tee "$RUNNER_TEMP/step.log") 2>&1
          set -x
          command -v nginx >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q nginx; }
          sudo systemctl start nginx
          curl -fsS -o /dev/null http://127.0.0.1/
          d="$RUNNER_TEMP/https"
          mkdir -p "$d"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 6 -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1' -keyout "$d/key.pem" -out "$d/fullchain.pem" 2>/dev/null
          sudo cp "$d/fullchain.pem" /usr/local/share/ca-certificates/sentence-ci.crt
          sudo update-ca-certificates >/dev/null
          sudo mkdir -p /root/.acme.sh
          sudo cp "$d/key.pem" /root/.acme.sh/ci-key.pem
          sudo cp "$d/fullchain.pem" /root/.acme.sh/ci-fullchain.pem
          sudo tee /root/.acme.sh/acme.sh >/dev/null <<'ACME'
          #!/bin/bash
          echo "$*" >> /root/.acme.sh/calls.log
          case " $* " in
            *" --issue "*)
              [ -f /root/.acme.sh/issued ] && exit 2
              host=$(sed -E 's/.* -d ([^ ]+).*/\1/' <<<"$*")
              t=ci-$RANDOM$RANDOM
              echo "$t" > "/var/www/acme/.well-known/acme-challenge/$t"
              got=$(curl -s -H "Host: $host" "http://127.0.0.1/.well-known/acme-challenge/$t")
              rm -f "/var/www/acme/.well-known/acme-challenge/$t"
              [ "$got" = "$t" ] || { echo "acme: 验证文件取不到：$got"; exit 1; }
              touch /root/.acme.sh/issued ;;
            *" --install-cert "*)
              while [ $# -gt 0 ]; do
                case $1 in
                  --key-file) cp /root/.acme.sh/ci-key.pem "$2" ;;
                  --fullchain-file) cp /root/.acme.sh/ci-fullchain.pem "$2" ;;
                esac
                shift
              done ;;
          esac
          exit 0
          ACME
          sudo chmod +x /root/.acme.sh/acme.sh

          # 第一次开：默认 8443
          sudo bash scripts/enable-https.sh 127.0.0.1
          sudo grep -q -- '--cert-profile shortlived' /root/.acme.sh/calls.log
          u=https://127.0.0.1:8443
          curl -fsS $u/api/health | grep -q '"db":true'
          # http://IP、以前的 http://IP:8080、用 http:// 打开 8443，都跳到 https://IP:8443；原来的网站不受影响
          redir() { curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$1"; }
          [ "$(redir http://127.0.0.1/)" = "301 $u/" ]
          [ "$(redir http://127.0.0.1:8080/x)" = "301 $u/x" ]
          [ "$(redir 'http://127.0.0.1:8443/y?z=1')" = "301 $u/y?z=1" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: other.test' http://127.0.0.1/)" = 200 ]
          # 登录 Cookie 要带 Secure（后端认出了 HTTPS）
          curl -fsS -c "$d/owner" -D "$d/h" -o /dev/null -X POST -H 'Content-Type: application/json' \
            -d '{"password":"ci-password"}' $u/api/unlock
          grep -i '^set-cookie: ss_session=' "$d/h" | grep -qi 'secure' || { echo "::error::登录 Cookie 没有 Secure"; exit 1; }
          # 后端看到的是访问者的真实 IP（这里是 127.0.0.1），不是 Docker 内网地址
          code=$(curl -fsS -b "$d/owner" -X POST -H 'Content-Type: application/json' -d '{"note":"ci"}' \
            $u/api/admin/invites | python3 -c 'import json,sys; print(json.load(sys.stdin)["invite"]["code"])')
          curl -fsS -c "$d/member" -o /dev/null -X POST -H 'Content-Type: application/json' \
            -d "{\"password\":\"$code\"}" $u/api/unlock
          ip=$(curl -fsS -b "$d/owner" $u/api/admin/invites \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["invites"][0]["devices"][0]["ip"])')
          [ "$ip" = 127.0.0.1 ] || { echo "::error::后端看到的 IP 是 $ip，不是真实 IP"; exit 1; }
          # 网站容器不再对外：只有本机 127.0.0.1:8081
          docker compose port web 80 | grep -q '^127.0.0.1:8081$'
          grep -q '^COOKIE_SECURE=1$' .env

          # 换端口：证书不用重新申请，8443 不再用
          sudo bash scripts/enable-https.sh --port 8444 | tee "$d/out"
          grep -q '不用重新申请' "$d/out"
          curl -fsS https://127.0.0.1:8444/api/health | grep -q '"db":true'
          if curl -s -m 3 -o /dev/null https://127.0.0.1:8443/; then echo "::error::8443 还在用"; exit 1; fi
          [ "$(redir http://127.0.0.1:8080/x)" = "301 https://127.0.0.1:8444/x" ]

          # 撤掉：回到 http://IP:8080
          sudo bash scripts/enable-https.sh --off
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"db":true'
          [ ! -e /etc/nginx/conf.d/sentence-site.conf ]
          [ ! -e /etc/nginx/sites-enabled/sentence-site.conf ]
          grep -q '^COOKIE_SECURE=0$' .env
      - name: 出错时打印日志
        if: failure()
        run: |
          docker compose logs --tail 100 --no-color | tee -a "$RUNNER_TEMP/step.log"
          body=$(grep -v '^\s*$' "$RUNNER_TEMP/step.log" | tail -n 60 | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=出错的输出（最后 60 行）::$body"
      - name: 清理
        if: always()
        run: |
          docker compose down -v
